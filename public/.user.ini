; cPanel / PHP-FPM picks this up from the docroot (public/).
; Values MUST include a unit suffix (M/G). A bare number is treated as BYTES
; by Laravel's ValidatePostSize middleware and will reject normal form posts.
post_max_size = 128M
upload_max_filesize = 128M
memory_limit = 512M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000
